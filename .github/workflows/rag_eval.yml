name: RAG Evaluation Benchmark

on:
  push:
    branches: [ main, master, chat-interface ]
  pull_request:
    branches: [ main, master, chat-interface ]

jobs:
  rag-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Evaluation (50 Qs x 4 Methods)
        run: |
          python evaluate.py --threshold 0.40 --top_k 3
